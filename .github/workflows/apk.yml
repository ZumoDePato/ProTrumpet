name: Compilar APK

on:
  # Solo a mano (Actions → Compilar APK → Run workflow)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar web (www)
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon.svg www/

      - name: Instalar Capacitor
        run: npm install

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Permiso de micrófono
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' "$M"

      - name: Icono (mejor esfuerzo)
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 icon.svg -o assets/icon-only.png
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff'

      - name: Sincronizar web
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Campana-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Campana APK (última versión)
          body: Descarga app-debug.apk e instálalo en el móvil.
          files: android/app/build/outputs/apk/debug/app-debug.apk
